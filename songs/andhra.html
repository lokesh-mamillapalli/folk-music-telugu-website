<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Folk songs from Andhra Pradesh — Telugu lyrics with transliteration, English translation and notes on each song." />
  <title>Andhra Pradesh Songs | Telugu Folk Songs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script>if(localStorage.getItem('folkSite_theme')==='light') document.documentElement.setAttribute('data-theme', 'light');</script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="../index.html">Telugu Folk Songs</a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="andhra.html" aria-current="page">Andhra Songs</a>
        <a href="telangana.html">Telangana Songs</a>
        <a href="../artists/index.html">Artists</a>
        <a href="../admin/login.html">Admin</a>
        <button id="theme-toggle" class="btn-secondary" style="padding: 0.4rem 0.6rem; margin-left: 0.5rem; border-radius: 50%;" aria-label="Toggle light/dark mode">🌗</button>
      </nav>
    </div>
  </header>

  <main class="container page-content" data-region="Andhra">
    <section class="hero compact">
      <h1>Andhra Pradesh Folk Songs</h1>
      <p class="hero-te">ఆంధ్రప్రదేశ్ జానపద గీతాలు</p>
      <p>Telugu lyrics with transliteration, English translation and notes on each song. Looking for Telangana? <a class="text-link" href="telangana.html">Telangana songs →</a></p>
    </section>

    <section class="filters-panel">
      <div class="filter-grid">
        <label>
          Search
          <input id="songs-search" type="search" placeholder="Search title, lyrics, tags..." />
        </label>
        <label>
          Category
          <select id="filter-category"></select>
        </label>
        <label>
          Artist
          <select id="filter-artist"></select>
        </label>
        <label>
          Sort
          <select id="sort-by">
            <option value="latest">Latest</option>
            <option value="alphabetical">Alphabetical</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Andhra Pradesh Songs</h2>
        <p id="songs-count" class="muted"></p>
      </div>
      <div id="songs-grid" class="grid cards-3"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"></div>
  </footer>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/songs.js"></script>
</body>
</html>
